<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Automated 12V Battery Charger Automation Controller with Real-time Cloud Sync & Smart Bill Analytics">
  <meta name="theme-color" content="#080C18">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VoltPulse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VoltPulse • Smart 12V Battery Charger</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // PWA Install Prompt Handler
    window.deferredPrompt = null;
    window.isPwaInstallable = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.isPwaInstallable = true;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      console.log('[PWA] beforeinstallprompt captured!');
    });

    window.triggerPwaInstall = async () => {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        const choice = await window.deferredPrompt.userChoice;
        window.deferredPrompt = null;
        window.isPwaInstallable = false;
        return choice.outcome === 'accepted';
      }
      return false;
    };
  </script>
</head>
<body style="background-color: #080C18; margin: 0; padding: 0;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
